<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main>
        <table>
            <tr>
                <td colspan="3">Tabla 1</td>
            </tr>

            <tr>
                <td>Celda</td>
                <td>Celda</td>
                <td>Celda</td>
            </tr>

            <tr>
                <td>Celda</td>
                <td>Celda</td>
                <td>Celda</td>
            </tr>
            <tr>
                <td>Celda</td>
                <td>Celda</td>
                <td>Celda</td>
            </tr>
        </table>

        <table>
            <tr>
                <td colspan="3">Tabla 2</td>
            </tr>
            <tr>
                <td>Celda</td>
                <td colspan="2">Celda</td>
            </tr>

            <tr>
                <td colspan="2">Celda</td>
                <td>Celda</td>
            </tr>
            <tr>
                <td>Celda</td>
                <td>Celda</td>
                <td>Celda</td>
            </tr>
        </table>

        <table>
            <tr>
                <td colspan="3">Tabla 3</td>
            </tr>

            <tr>
                <td rowspan="3">Celda</td>
                <td>Celda</td>
                <td>Celda</td>
            </tr>

            <tr>
                <td>Celda</td>
                <td>Celda</td>
            </tr>
            <tr>
                <td>Celda</td>
                <td>Celda</td>
            </tr>
        </table>

        <table>
            <tr>
                <td colspan="3">Tabla 4</td>
            </tr>

            <tr>
                <td rowspan="4">Celda</td>
                <td colspan="2">Celda</td>
            </tr>

            <tr>
                <td rowspan="2">Celda</td>
                <td>Celda</td>
            </tr>
            <tr>
                <td>Celda</td>
            </tr>
            <tr>
                <td>Celda</td>
                <td>Celda</td>
            </tr>
            <tr>
                <td>Celda</td>
                <td>Celda</td>
                <td>Celda</td>
            </tr>
        </table>
    </main>
</body>
</html>
